# Coolify / ローカル共通の構成。
# S3 互換ストレージは外部のもの（Coolify 側で用意したもの）を環境変数で指定する。
services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      PORT: 8787
      DATABASE_URL: postgres://tukurium:${POSTGRES_PASSWORD:-tukurium}@postgres:5432/tukurium
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-tukurium}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      GIT_DATA_DIR: /data/git
    volumes:
      - git-data:/data/git
    ports:
      - "${APP_PORT:-8787}:8787"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tukurium
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tukurium}
      POSTGRES_DB: tukurium
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tukurium"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  git-data:
  pg-data:
