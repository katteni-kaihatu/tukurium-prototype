# Coolify / ローカル共通の構成。
# ローカルで S3 互換ストレージも立てる場合：docker compose --profile local up
services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      PORT: 8787
      DATABASE_URL: ${DATABASE_URL:-postgres://tukurium:tukurium@postgres:5432/tukurium}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-tukurium}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-tukurium}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-tukurium-secret}
      GIT_DATA_DIR: /data/git
    volumes:
      - git-data:/data/git
    ports:
      - "${APP_PORT:-8787}:8787"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tukurium
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tukurium}
      POSTGRES_DB: tukurium
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tukurium"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    profiles: ["local"]
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: tukurium
      MINIO_ROOT_PASSWORD: tukurium-secret
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

volumes:
  git-data:
  pg-data:
  minio-data:
